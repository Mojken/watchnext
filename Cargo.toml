workspace = { members = ["test-qb"] }
[package]
name = "watchnext"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rss = "2.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
error-chain = "0.12"
reqwest = {version = "0.12", features = ["blocking"]}
url = "2.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
priority-queue = "2.0"
roman = "0.1"
qbit-rs = "0.4"
tokio = { version = "1.38", features = ["full"] }
trpl = "0.2.0"
log = "0.4.27"
env_logger = "0.11.8"
futures = "0.3.31"
#mpris-server = "0.8.0"
